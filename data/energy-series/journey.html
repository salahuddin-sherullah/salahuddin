    <div class="energy-journey-stories" aria-live="polite" aria-atomic="true">
        <div id="journey-story-0" class="energy-journey-story"><span class="energy-section-number">01 / It starts here</span><h4>Before you touch the switch</h4><p>At a power station, a generator uses moving water, burning fuel or nuclear heat to produce electricity. Solar panels convert sunlight directly. The power is now ready to enter the grid.</p><p class="energy-journey-stake"><strong>What you pay for:</strong> producing electricity and keeping the plant ready.</p></div>
        <div id="journey-story-1" class="energy-journey-story"><span class="energy-section-number">02 / The long-distance leg</span><h4>Over fields, rivers and cities</h4><p>Transformers raise the voltage so power can travel long distances with lower losses. These lines are the system’s main roads. Congestion can keep a working plant’s output from reaching the places that need it.</p><p class="energy-journey-stake"><strong>What you pay for:</strong> the high-voltage network that carries power across the country.</p></div>
        <div id="journey-story-2" class="energy-journey-story"><span class="energy-section-number">03 / The last few kilometres</span><h4>From the main grid to your street</h4><p>Substations and local transformers lower the voltage. Your distribution company carries power through feeders, poles and cables to your building. A local fault can cut supply even when the national grid is running.</p><p class="energy-journey-stake"><strong>What you pay for:</strong> the local network, its upkeep, metering and customer service.</p></div>
        <div id="journey-story-3" class="energy-journey-story"><span class="energy-section-number">04 / At last, the switch</span><h4>The switch completes the journey</h4><p>Your meter records electricity in kilowatt-hours, the “units” on your bill. Switching on a light depends on every earlier stage working. Now the people and equipment behind that journey must be paid.</p><p class="energy-journey-stake"><strong>What you pay for:</strong> electricity used at home and the network that brings it here.</p></div>
    </div>
